# Render 测试环境 Blueprint。数据库和验证码 Key Value 均与生产隔离。
services:
  - type: keyvalue
    name: clothes-shopping-guide-test-redis
    region: oregon
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: clothes-shopping-guide-test-api
    runtime: docker
    dockerfilePath: ./deploy/docker/api.Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    branch: codex/render-test-env
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: RUN_TEST_CATALOG_SEEDER
        value: 'true'
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '5432'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGCHANNELBINDING
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: PRODUCT_QUERY_CURSOR_SECRET
        generateValue: true
      - key: CAPTCHA_STORAGE
        value: redis
      - key: CAPTCHA_REDIS_URL
        fromService:
          type: keyvalue
          name: clothes-shopping-guide-test-redis
          property: connectionString
      - key: CAPTCHA_HMAC_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_API_KEY
        value: test-disabled-no-provider-key
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: TRY_ON_STORAGE_DRIVER
        value: qiniu
      - key: TRY_ON_ENABLED
        value: 'false'
      - key: TRY_ON_REAL_PHOTOS_ENABLED
        value: 'false'
      - key: SEED_ADMIN_EMAIL
        value: test-admin@example.invalid
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_ADMIN_DISPLAY_NAME
        value: 测试管理员

  - type: web
    name: clothes-shopping-guide-test-web-docker
    runtime: docker
    dockerfilePath: ./deploy/docker/web.Dockerfile
    dockerContext: .
    branch: codex/render-test-env
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: PORT
        value: '8080'
      - key: VITE_API_BASE_URL
        value: https://clothes-shopping-guide-test-api.onrender.com/api
