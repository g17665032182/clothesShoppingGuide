# Render Blueprint：从仓库根目录部署 API、Web 和验证码 Key Value。
# 生产 Key Value 仅允许 Render 私网连接；应用密钥由 Render 管理，不提交到仓库。
services:
  - type: keyvalue
    name: clothes-shopping-guide-redis
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: clothes-shopping-guide-api
    runtime: docker
    dockerfilePath: ./deploy/docker/api.Dockerfile
    dockerContext: .
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '5432'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGCHANNELBINDING
        value: require
      - key: JWT_SECRET
        sync: false
      - key: PRODUCT_QUERY_CURSOR_SECRET
        sync: false
      - key: CAPTCHA_STORAGE
        value: redis
      - key: CAPTCHA_REDIS_URL
        fromService:
          type: keyvalue
          name: clothes-shopping-guide-redis
          property: connectionString
      - key: CAPTCHA_HMAC_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TRY_ON_STORAGE_DRIVER
        value: qiniu
      - key: TRY_ON_ENABLED
        value: 'false'
      - key: TRY_ON_REAL_PHOTOS_ENABLED
        value: 'false'
      - key: QINIU_ACCESS_KEY
        sync: false
      - key: QINIU_SECRET_KEY
        sync: false
      - key: QINIU_BUCKET
        sync: false
      - key: QINIU_DOMAIN
        sync: false
      - key: QINIU_REGION
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_DISPLAY_NAME
        sync: false

  - type: web
    name: clothes-shopping-guide-web-docker
    runtime: docker
    dockerfilePath: ./deploy/docker/web.Dockerfile
    dockerContext: .
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: PORT
        value: '8080'
      - key: VITE_API_BASE_URL
        value: https://clothes-shopping-guide-api.onrender.com/api
