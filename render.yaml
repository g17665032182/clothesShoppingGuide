# Render Blueprint：从仓库根目录构建 pnpm Monorepo 的 API 和 Web。
# 真实密钥全部通过 sync: false 在 Render Dashboard 中填写，不写入仓库。
services:
  - type: web
    name: clothes-shopping-guide-api
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    # Free 计划不支持 preDeployCommand，因此在编译完成后执行增量迁移和幂等 Seeder。
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @clothes-shopping-guide/api build && pnpm deploy:prepare:built
    startCommand: pnpm start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: '5432'
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PGCHANNELBINDING
        value: require
      - key: JWT_SECRET
        sync: false
      - key: PRODUCT_QUERY_CURSOR_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: TRY_ON_STORAGE_DRIVER
        value: qiniu
      - key: TRY_ON_ENABLED
        value: 'false'
      - key: TRY_ON_REAL_PHOTOS_ENABLED
        value: 'false'
      - key: QINIU_ACCESS_KEY
        sync: false
      - key: QINIU_SECRET_KEY
        sync: false
      - key: QINIU_BUCKET
        sync: false
      - key: QINIU_DOMAIN
        sync: false
      - key: QINIU_REGION
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_ADMIN_DISPLAY_NAME
        sync: false

  - type: web
    name: clothes-shopping-guide-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @clothes-shopping-guide/web build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://clothes-shopping-guide-api.onrender.com/api
    routes:
      # Vue Router 使用 history 模式，未知路径统一回退到入口页面。
      - type: rewrite
        source: /*
        destination: /index.html
