apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clothes-guide
  labels:
    app.kubernetes.io/part-of: clothes-shopping-guide
spec:
  parentRefs:
    - name: clothes-guide-gateway
  hostnames:
    - staging.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: clothes-guide-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: clothes-guide-web
          port: 80
