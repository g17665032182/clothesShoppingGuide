apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: clothes-shopping-guide
      app.kubernetes.io/managed-by: kustomize

images:
  - name: clothes-guide-api
    newName: ghcr.io/g17665032182/clothes-guide-api
    newTag: latest
  - name: clothes-guide-web
    newName: ghcr.io/g17665032182/clothes-guide-web
    newTag: latest
