apiVersion: apps/v1
kind: Deployment
metadata:
  name: clothes-guide-web
spec:
  template:
    spec:
      imagePullSecrets: []
      containers:
        - name: web
          imagePullPolicy: Never
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: clothes-guide-web-nginx
