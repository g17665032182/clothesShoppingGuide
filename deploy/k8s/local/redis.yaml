apiVersion: v1
kind: Service
metadata:
  name: clothes-guide-redis
spec:
  selector:
    app.kubernetes.io/name: clothes-guide-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clothes-guide-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clothes-guide-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clothes-guide-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          args:
            - redis-server
            - --save
            - ''
            - --appendonly
            - 'no'
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
