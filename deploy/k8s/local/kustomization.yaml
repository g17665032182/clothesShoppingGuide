apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: clothes-guide-dev

resources:
  - ../base
  - postgres.yaml
  - redis.yaml
  - nginx-config.yaml

images:
  - name: ghcr.io/g17665032182/clothes-guide-api
    newName: clothes-guide-api
    newTag: local
  - name: ghcr.io/g17665032182/clothes-guide-web
    newName: clothes-guide-web
    newTag: local

patches:
  - path: api-patch.yaml
  - path: web-patch.yaml
