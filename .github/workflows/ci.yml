name: CI

on:
  push:
    branches:
      - main
      - codex/render-test-env
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 校验任务只需要读取仓库内容。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clothes
          POSTGRES_PASSWORD: clothes
          POSTGRES_DB: clothes_guide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clothes -d clothes_guide"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 校验代码
        run: pnpm check
      - name: 运行 API 自动化测试
        run: pnpm --filter @clothes-shopping-guide/api test
      - name: 验证数据库迁移和 Seeder
        run: |
          pnpm migration:fresh
          # 仅测试环境分支在 CI 临时库中验证商品 Seeder。
          if [ "$GITHUB_REF" = "refs/heads/codex/render-test-env" ]; then
            pnpm --filter @clothes-shopping-guide/api catalog:seed:test:built
          fi
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: clothes
          DB_PASSWORD: clothes
          DB_NAME: clothes_guide
          DB_SSL: 'false'
